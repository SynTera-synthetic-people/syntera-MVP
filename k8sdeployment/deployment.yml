# =========================
# Backend Deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: synth-backend-production
  namespace: syntera-prod
  labels:
    app: synth-backend-production
spec:
  replicas: 4
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: synth-backend-production
  template:
    metadata:
      labels:
        app: synth-backend-production
    spec:
      serviceAccountName: ssm-reader
      initContainers:
        - name: migrate
          image: 175337843263.dkr.ecr.ap-south-1.amazonaws.com/syntera-platfrom-backend:latest
          command:
            - sh
            - -c
            - |
              echo "Running migrations if needed..."
              alembic upgrade head || echo "Migrations already applied, skipping."
          env:
            - name: AWS_REGION
              value: ap-south-1
            - name: SSM_PATH
              value: "/app/platform/"
      containers:
        - name: backend
          image: 175337843263.dkr.ecr.ap-south-1.amazonaws.com/syntera-platfrom-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          args:
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --proxy-headers
            - --forwarded-allow-ips=*
          env:
            - name: AWS_REGION
              value: ap-south-1
            - name: SSM_PATH
              value: "/app/platform/"
            - name: CORS_ORIGINS
              value: "https://platform.synthetic-people.ai"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

---
# =========================
# Horizontal Pod Autoscaler

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: synth-backend-production-hpa
  namespace: syntera-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: synth-backend-production
  minReplicas: 4
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

