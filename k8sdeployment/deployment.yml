# =========================
# Backend Deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: synth-backend-production
  namespace: syntera-prod
  labels:
    app: synth-backend-production
spec:
  replicas: 4
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: synth-backend-production
  template:
    metadata:
      labels:
        app: synth-backend-production
    spec:
      serviceAccountName: ssm-reader

      # Migrations are NOT run here. They run once per deploy in a dedicated
      # Job (k8sdeployment/migrate-job.production.yaml) that CI creates and
      # waits on before this Deployment's image is updated.
      #
      # The initContainer this replaces ran per pod — 4x per deploy plus every
      # restart, and up to 20x under the HPA — and ended in
      # `|| echo "Migrations already applied, skipping."`, which made it exit 0
      # even when the migration failed. On a fresh production database that
      # means the app starts against a schema that was never created.
      #
      # DATABASE_URL is resolved inside the container from AWS SSM using
      # SSM_PATH below (/app/platform/) — see app/parameters.py.

      containers:
        - name: backend
          # Substituted by production.yml with the immutable github.sha tag —
          # the same image the migration Job ran. Was `:latest`, which let
          # `kubectl apply` overwrite the tag `kubectl set image` had just set.
          # Uppercase placeholder: an unsubstituted apply is rejected outright.
          image: APPLICATION_IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          args:
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --proxy-headers
            - --forwarded-allow-ips=*
          env:
            - name: AWS_REGION
              value: ap-south-1
            - name: SSM_PATH
              value: "/app/platform/"
            - name: CORS_ORIGINS
              value: "https://platform.synthetic-people.ai"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

---
# =========================
# Horizontal Pod Autoscaler

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: synth-backend-production-hpa
  namespace: syntera-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: synth-backend-production
  minReplicas: 4
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

