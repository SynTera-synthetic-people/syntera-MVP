apiVersion: apps/v1
kind: Deployment
metadata:
  name: synth-backend
  namespace: syntera-mvp
  labels:
    app: synth-backend
spec:
  replicas: 4
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      app: synth-backend
  template:
    metadata:
      labels:
        app: synth-backend
    spec:
      serviceAccountName: ssm-reader

      # Migrations are NOT run here. They run once per deploy in a dedicated
      # Job (k8sdeployment/migrate-job.yaml) that CI creates and waits on
      # before this Deployment's image is updated. The previous initContainer
      # ran per pod (4x per deploy plus every restart) and its `|| echo`
      # fallback made it exit 0 even when the migration failed.
      #
      # DATABASE_URL is resolved inside the container from AWS SSM using
      # SSM_PATH below — see app/parameters.py.

      containers:
        - name: backend
          image: 175337843263.dkr.ecr.ap-south-1.amazonaws.com/synth-backend
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          args:
            - uvicorn
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --proxy-headers
            - --forwarded-allow-ips=*
          env:
            - name: AWS_REGION
              value: ap-south-1
            - name: SSM_PATH
              value: "/app/staging/"
            - name: CORS_ORIGINS
              value: "https://staging-ui.synthetic-people.ai"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
