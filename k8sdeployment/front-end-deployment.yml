apiVersion: apps/v1
kind: Deployment
metadata:
  name: synth-frontend-production
  namespace: syntera-prod
  labels:
    app: synth-frontend-production

spec:
  replicas: 2
  selector:
    matchLabels:
      app: synth-frontend-production

  template:
    metadata:
      labels:
        app: synth-frontend-production

    spec:
      containers:
        - name: frontend
          image: 175337843263.dkr.ecr.ap-south-1.amazonaws.com/syntera-platfrom-frontend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 5173

          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: synth-frontend-production-hpa
  namespace: syntera-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: synth-frontend-production
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

