name: Deploy Frontend & Backend to EKS (syntera-prod)

on:
  push:
    branches: [ "production" ]
    paths:
      - "frontend/**"
      - "backend/**"
      - "k8sdeployment/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ "production" ]
    paths:
      - "frontend/**"
      - "backend/**"
      - "k8sdeployment/**"
      - ".github/workflows/**"
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: eks-staging
  NAMESPACE: syntera-prod
  ECR_FRONTEND_REPO: syntera-platfrom-frontend
  ECR_BACKEND_REPO: syntera-platfrom-backend

jobs:
  deploy:
    runs-on: [self-hosted, production]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Frontend
        id: build-frontend
        working-directory: frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG
          echo "frontend_image=$ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build & Push Backend
        id: build-backend
        working-directory: backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG
          echo "backend_image=$ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

      - name: Deploy to EKS
        run: |
          set -e
          
          # Frontend rollout (Deployment + HPA in one file)
          kubectl set image deployment/synth-frontend-production frontend=${{ steps.build-frontend.outputs.frontend_image }} -n $NAMESPACE
          kubectl apply -f k8sdeployment/front-end-deployment.yml -n $NAMESPACE
          kubectl apply -f k8sdeployment/front-end-service.yml -n $NAMESPACE
          kubectl apply -f k8sdeployment/front-ingress.yml -n $NAMESPACE
          kubectl rollout status deployment/synth-frontend-production -n $NAMESPACE || \
            (echo "Frontend rollout failed, rolling back..." && kubectl rollout undo deployment/synth-frontend-production -n $NAMESPACE)
          
          # Backend rollout (Deployment + HPA in one file)
          kubectl set image deployment/synth-backend-production backend=${{ steps.build-backend.outputs.backend_image }} -n $NAMESPACE
          kubectl apply -f k8sdeployment/deployment.yml -n $NAMESPACE
          kubectl apply -f k8sdeployment/service.yml -n $NAMESPACE
          kubectl apply -f k8sdeployment/ingress.yml -n $NAMESPACE
          kubectl rollout status deployment/synth-backend-production -n $NAMESPACE || \
            (echo "Backend rollout failed, rolling back..." && kubectl rollout undo deployment/synth-backend-production -n $NAMESPACE)
