name: Deploy Frontend & Backend to EKS (syntera-prod)

# Push only. A `pull_request` trigger previously ran this whole workflow —
# including the production migration and rollout — for any PR *targeting*
# production, before the code was merged and reviewed. Opening or updating a
# PR must never migrate or deploy production.
#
# Pull requests are still validated: .github/workflows/migrations.yml runs on
# `pull_request` and executes the migration test suite. That is the PR gate.
# This workflow is the release, and it only runs on merge.
on:
  push:
    branches: [ "production" ]
    paths:
      - "frontend/**"
      - "backend/**"
      - "k8sdeployment/**"
      - ".github/workflows/**"
  workflow_dispatch:

# Two production deploys running at once would race on the migration Job: both
# could read the same alembic_version and one would fail on an already-applied
# revision. The advisory lock in alembic/env.py serialises them at the database
# level; this serialises them at the pipeline level so the second never starts.
# cancel-in-progress is deliberately false — cancelling mid-migration is worse
# than queueing. Distinct from staging's group: the two environments have
# separate databases and must not block each other.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: eks-staging
  NAMESPACE: syntera-prod
  ECR_FRONTEND_REPO: syntera-platfrom-frontend
  ECR_BACKEND_REPO: syntera-platfrom-backend

jobs:
  deploy:
    runs-on: [self-hosted, production]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Frontend
        id: build-frontend
        working-directory: frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG
          echo "frontend_image=$ECR_REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build & Push Backend
        id: build-backend
        working-directory: backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG
          echo "backend_image=$ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER

      # Apply database migrations BEFORE any pod runs the new image. This step
      # is the deployment gate: if it fails, the rollout never starts and the
      # previous version keeps serving.
      #
      # Uses migrate-job.production.yaml, NOT migrate-job.yaml. The production
      # overlay carries SSM_PATH=/app/platform/ and namespace syntera-prod; the
      # staging manifest carries /app/staging/. Pointing this at the wrong file
      # would resolve staging's DATABASE_URL, find staging already at head, do
      # nothing, and exit 0 — a green Job and an empty production database.
      #
      # On the first production run this executes 0001_baseline (creating the
      # full schema on the new empty database) and then 0002_validate_fks. The
      # production database is NOT stamped: stamping is only for databases that
      # already carry the schema, such as staging.
      - name: Run database migrations
        run: |
          set -euo pipefail

          sed "s|MIGRATION_IMAGE_PLACEHOLDER|${{ steps.build-backend.outputs.backend_image }}|" \
            k8sdeployment/migrate-job.production.yaml > /tmp/migrate-job-prod.yaml

          echo "----- job configuration -----"
          grep -E 'namespace:|SSM_PATH|image:' -A1 /tmp/migrate-job-prod.yaml || true
          echo "-----------------------------"

          JOB=$(kubectl create -f /tmp/migrate-job-prod.yaml -n $NAMESPACE -o name)
          echo "Created $JOB"

          # `kubectl wait --for=condition=complete` blocks for the full timeout
          # when a Job fails, so race both conditions and take whichever
          # resolves first. Without this a failed migration costs 15 minutes of
          # pipeline time before reporting.
          kubectl wait --for=condition=complete --timeout=900s "$JOB" -n $NAMESPACE &
          COMPLETE_PID=$!
          kubectl wait --for=condition=failed --timeout=900s "$JOB" -n $NAMESPACE \
            && echo "MIGRATION FAILED" && exit 1 &
          FAILED_PID=$!
          wait -n $COMPLETE_PID $FAILED_PID || true

          echo "----- migration log -----"
          kubectl logs "$JOB" -n $NAMESPACE --tail=-1 || true
          echo "-------------------------"

          # Authoritative check: the Job must report exactly one success.
          # There is deliberately no `|| echo` anywhere in this step — the exit
          # code is the gate.
          SUCCEEDED=$(kubectl get "$JOB" -n $NAMESPACE -o jsonpath='{.status.succeeded}')
          if [ "$SUCCEEDED" != "1" ]; then
            echo "Migration did not succeed (succeeded=${SUCCEEDED:-0}). Aborting deploy."
            exit 1
          fi
          echo "Migrations applied successfully."

      - name: Deploy to EKS
        run: |
          set -e

          # Frontend rollout (Deployment + HPA in one file)
          kubectl set image deployment/synth-frontend-production frontend=${{ steps.build-frontend.outputs.frontend_image }} -n $NAMESPACE
          kubectl apply -f k8sdeployment/front-end-deployment.yml -n $NAMESPACE
          kubectl apply -f k8sdeployment/front-end-service.yml -n $NAMESPACE
          kubectl apply -f k8sdeployment/front-ingress.yml -n $NAMESPACE
          kubectl rollout status deployment/synth-frontend-production -n $NAMESPACE || \
            (echo "Frontend rollout failed, rolling back..." && kubectl rollout undo deployment/synth-frontend-production -n $NAMESPACE)

          # Backend rollout (Deployment + HPA in one file).
          #
          # The image is substituted into the manifest and applied once, rather
          # than `kubectl set image` followed by `kubectl apply`. In that order
          # the apply re-asserted the manifest's own tag and undid the set
          # image, so the Deployment reverted to whatever that tag pointed at.
          #
          # This is the same immutable ${{ github.sha }} tag the migration Job
          # above already ran, so the schema and the code that uses it come
          # from one build.
          sed "s|APPLICATION_IMAGE_PLACEHOLDER|${{ steps.build-backend.outputs.backend_image }}|" \
            k8sdeployment/deployment.yml > /tmp/deployment-prod.yml

          grep -n 'image:' /tmp/deployment-prod.yml

          kubectl apply -f /tmp/deployment-prod.yml -n $NAMESPACE
          kubectl apply -f k8sdeployment/service.yml -n $NAMESPACE
          kubectl apply -f k8sdeployment/ingress.yml -n $NAMESPACE
          kubectl rollout status deployment/synth-backend-production -n $NAMESPACE || \
            (echo "Backend rollout failed, rolling back..." && kubectl rollout undo deployment/synth-backend-production -n $NAMESPACE)
