# Alembic configuration — Syntera backend
#
# The database URL is deliberately NOT set here. It is resolved in
# alembic/env.py from app.config.settings, which is the same code path the
# application uses (including the AWS SSM parameter load). Keeping exactly one
# source of connection truth is what prevents a migration from running against
# a different database than the one the app talks to.

[alembic]
script_location = alembic
prepend_sys_path = .

# Lexically sortable revision filenames: 20260807_ab12cd34_add_foo.py
# Alembic's chain is a linked list, not a sequence, but sortable filenames make
# `ls versions/` readable and make merge conflicts obvious in review.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Recursive version directories are not used; keep the tree flat.
version_path_separator = os

# sqlalchemy.url is intentionally absent — see the note above.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s | %(levelname)-5.5s | %(name)s | %(message)s
datefmt = %Y-%m-%d %H:%M:%S
